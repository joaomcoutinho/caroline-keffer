name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  # Permite disparar o deploy à mão pela aba Actions.
  workflow_dispatch:

# Só o token do próprio workflow, com a permissão mínima para publicar.
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez. Não cancela o que já está rodando, para não publicar
# um build pela metade.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build estático
        # DEPLOY_ALVO liga o output export e o basePath (ver next.config.ts).
        env:
          DEPLOY_ALVO: pages
          # O basePath do Next não alcança o `src` das imagens quando o
          # otimizador está desligado; o helper lib/caminho.ts usa isto.
          NEXT_PUBLIC_BASE_PATH: /caroline-keffer
        run: npm run build

      - name: Impedir que o Jekyll ignore a pasta _next
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
