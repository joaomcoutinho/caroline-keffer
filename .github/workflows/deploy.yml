name: Prévia antiga no GitHub Pages vira redirecionamento

# O site vive no Cloudflare Pages, em clinicacarolinekeffer.com.br, desde
# 06/10/2026 (publicar: `npm run publicar` em site/). A prévia antiga em
# joaomcoutinho.github.io/caroline-keffer não pode competir com o domínio
# (seo-mxc 1.18 e 2.09, 29/10/2026). Antes ela saía como cópia do site com
# `Disallow` no robots.txt, que esconde a página do robô mas deixa o endereço
# indexável. Agora toda URL dela manda o visitante para o MESMO caminho no
# domínio, e a página leva `noindex` + canônica no domínio. Sem robots.txt de
# propósito: o robô precisa entrar para ver o `noindex`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Página de redirecionamento
        run: |
          mkdir -p out
          cat > out/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <head>
          <meta charset="utf-8">
          <meta name="robots" content="noindex">
          <link rel="canonical" href="https://clinicacarolinekeffer.com.br/">
          <title>Clínica Pet Caroline Keffer</title>
          <script>
          var p = location.pathname.replace(/^\/caroline-keffer/, "") || "/";
          location.replace("https://clinicacarolinekeffer.com.br" + p + location.search + location.hash);
          </script>
          <meta http-equiv="refresh" content="0; url=https://clinicacarolinekeffer.com.br/">
          </head>
          <body><a href="https://clinicacarolinekeffer.com.br/">clinicacarolinekeffer.com.br</a></body>
          </html>
          HTML
          cp out/index.html out/404.html
          touch out/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
