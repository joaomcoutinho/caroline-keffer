<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="base.css"><style>
body{background:#0d4658}
.tela{background:#0d4658}
h1{font-size:36px;line-height:1.05}
.sub{font-size:16px;line-height:1.5;color:#d6e9ef}
.ctas{flex-direction:column;align-items:stretch;width:100%}
.cta,.cta2{width:100%}
.av{position:absolute}
h1 .l{display:block}
.av .f{width:100%;height:100%;border-radius:50%;border:3px solid #fff;background-size:cover;box-shadow:0 10px 24px -10px rgb(4 30 40/.7);outline:2.5px solid #7ec0dc;outline-offset:3px}
.av span{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);white-space:nowrap;background:#fff;color:#0d4658;font-weight:800;font-size:11px;padding:2px 8px;border-radius:999px;box-shadow:0 0 0 2px #7ec0dc}

.foto{position:absolute;left:0;right:0;top:0;height:60%;background:url(fachada_ceu.webp) center 38%/cover;animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.08)}}
.foto::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgb(13 70 88/.55) 0%,transparent 22%,transparent 70%,rgb(13 70 88/.35) 100%)}
.folha{position:absolute;left:0;right:0;bottom:0;top:54%;background:linear-gradient(180deg,#135a72,#0d4658);border-radius:32px 32px 0 0;padding:64px 20px 0;text-align:center;box-shadow:0 -20px 40px -20px rgb(4 30 40/.6)}
.folha::before{content:"";position:absolute;inset:0;border-radius:inherit;border-top:1px solid rgb(255 255 255/.18)}
.folha .sub{margin:10px auto 0;max-width:30ch}
.folha .ctas{margin-top:20px}
.a1{left:calc(50% - 150px);top:calc(54% - 30px);width:58px;height:64px;transform:rotate(-24deg)}
.a2{left:calc(50% - 88px);top:calc(54% - 62px);width:72px;height:80px;transform:rotate(-8deg)}
.a2 span{transform:translateX(-50%) rotate(8deg)}
.a3{left:calc(50% + 16px);top:calc(54% - 62px);width:72px;height:80px;transform:rotate(8deg)}
.a4{left:calc(50% + 92px);top:calc(54% - 30px);width:58px;height:64px;transform:rotate(24deg)}
.a1 .f,.a3 .f,.a4 .f{outline:none}
.av{z-index:5}
